<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <P>Score: <span id="score">0</span></P>
    
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls (arrow keys)
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================
        
        let speed = 500;
        const MINSPEED = 75;

        
        const updateGame = () => {
            // Move the snake
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            
            let isEating = compareXY(head.x, head.y, food.x, food.y)           
            let isOutside = checkBoundaries(head);
            let selfCollision = checkSelfCollision(snake, head);

            if (isOutside || selfCollision) {
                gameOver()
                return;
            }

            snake.unshift(head);
            if (isEating)  {
                addScore();
                increaseSpeed();
                newFood();
            } else {
                snake.pop();
            }
            drawGame();
        }

        let gameLoop = setInterval(updateGame, speed);
        
        const increaseSpeed = () => {
            if (speed > MINSPEED) {
                speed -= 25;
            } else {
                speed =MINSPEED;
            }
            clearInterval(gameLoop);
            gameLoop = setInterval(updateGame, speed);
        }
           

        const gameOver = () => {
            document.getElementById("info").textContent = "Game-Over"
            clearInterval(gameLoop)

        }

        const compareXY = (x,y,x2,y2) => {
            if (x === x2 && y === y2)  {
                return true;
            }
            return false;

        }

        const addScore = () => {
            score++;
            document.getElementById("score").textContent = score;
        }

        const newFood = () => {
            const newX = Math.floor(Math.random() * tileCount);
            const newY = Math.floor(Math.random() * tileCount);
            food.x = newX
            food.y = newY
        }

        const checkBoundaries = (head) => {
            return (head.x >= tileCount || head.y >= tileCount || head.x < 0 || head.y <0) ? true : false;

        }

        const checkSelfCollision = (list, head) => {
              return list.some(part => {
                return part.x === head.x && part.y === head.y
              });
        }

        // Movement controls
        document.addEventListener("keydown", (e) => {
            e.preventDefault();
            switch (e.key) {          
                case "w":
                case "ArrowUp":
                    if (direction.y === 1) break; // Prevent reversing direction
                    direction = { x: 0, y: -1 };
                    break;
                case "s":
                case "ArrowDown":
                    if (direction.y === -1) break; // Prevent reversing direction
                        direction = { x: 0, y: 1 };
                        break;
                case "a":
                case "ArrowLeft":
                        if (direction.x === 1) break; // Prevent reversing direction
                        direction = { x: -1, y: 0 };
                        break;
                case "d":
                case "ArrowRight":
                    if (direction.x === -1) break; // Prevent reversing direction
                    direction = { x: 1, y: 0 };
                    break;
            }            
        })

    </script>

</body>
</html>
