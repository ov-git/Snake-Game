<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <div id="container">
    <div id="scoreboard">
        <p class="score" id="highscore">High Score: <span id="highscore-value">0</span></p>
        <P class="score" id="score">Score: <span id="score-value">0</span></P>
    </div>
    
    <div id="canvas-container">
        <div id="info-container">
            <p id="info-message">START GAME</p>
            <p id="info-text">Press to start</p>
            <button id="restart" style="display: block;">Start</button>

        </div>
        <canvas id="gameCanvas" width="400"
        height="400"></canvas>
    </div>
    
    <div id="game-info">
        <p id="info"></p>
    </div>
 </div>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };// used to prevent rapid turning trgiggering self-collision
        let food = { x: 15, y: 15 };
        let score = 0;
        let isPaused = false;
        let isPlaying = false;

        // ===== DRAWING =====
        const drawGame = () => {
            clearCanvas();

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "green";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        const clearCanvas = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        };



        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls (arrow keys)
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================
        
        let gameLoop;
        let speed = 500;
        let highscore = Number(localStorage.getItem("highscore")) || 0;
        const MINSPEED = 75;

        const updateGame = () => {
            // Move the snake
            direction = nextDirection; // Update direction at the start of the game loop
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            
            let isEating = compareXY(head.x, head.y, food.x, food.y)           
            let isOutside = checkBoundaries(head);
            let selfCollision = checkSelfCollision(snake, head);

            if (isOutside || selfCollision) {
                gameOver()
                isPlaying = false;
                return;
            }

            snake.unshift(head);
            if (isEating)  {
                addScore();
                increaseSpeed();
                newFood();
            } else {
                snake.pop();
            }
            drawGame();
        }

        const startGame = () => {
            let startTimer = 3;
            isPaused = false;
            
            snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            food = { x: 15, y: 15 };
            score = 0;
            speed = 500;

            document.getElementById("highscore-value").textContent = highscore;
            document.getElementById("restart").style.display = "none";
            document.getElementById("info-message").textContent = "";
            document.getElementById("info-text").textContent = "";
            document.getElementById("score-value").textContent = score;
            document.getElementById("info").textContent = "Press P to pause";
            document.getElementById("info-message").classList.remove("game-over");   

            clearCanvas();

            document.getElementById("info-message").textContent = startTimer.toString();
            document.getElementById("info-message").classList.add("countdown");
            const startInterval = setInterval(() => {
                startTimer--;
                document.getElementById("info-message").textContent = startTimer.toString();
                if (startTimer <= 0) {
                    isPlaying = true;
                    document.getElementById("info-message").classList.remove("countdown");
                    document.getElementById("info-message").textContent = "";
                    clearInterval(startInterval);
                    gameLoop = setInterval(updateGame, speed);
                    drawGame();
                }
            }, 1000);
        }

        const gameOver = () => {  
            isPlaying = false;
            document.getElementById("info-message").classList.add("game-over");   
            document.getElementById("info-message").textContent = "Game-Over"
            clearInterval(gameLoop)

            if (score > highscore) {
                localStorage.setItem("highscore", score.toString());
                document.getElementById("info-text").textContent = "New Highscore: " + score;
                document.getElementById("highscore-value").textContent = score;
                highscore = score;
            }
            document.getElementById("restart").style.display = "block";
            document.getElementById("info").textContent = "";
        }

        const togglePause = () => {
            if (isPaused) {
                gameLoop = setInterval(updateGame, speed);
                document.getElementById("info-message").textContent = "";
                document.getElementById("info-text").textContent = "";
                document.getElementById("info").textContent = "Press P to pause";
            } else {
                clearInterval(gameLoop);
                document.getElementById("info-message").textContent = "Paused";
                document.getElementById("info-text").textContent = "Press P to resume";
                document.getElementById("info").textContent = "";
            }
            isPaused = !isPaused;
        }

        
        const increaseSpeed = () => {
            if (speed > MINSPEED) {
                speed -= 25;
            } else {
                speed =MINSPEED;
            }
            clearInterval(gameLoop);
            gameLoop = setInterval(updateGame, speed);
        }
        
        

        const compareXY = (x,y,x2,y2) => {
            if (x === x2 && y === y2)  {
                return true;
            }
            return false;

        }

        const addScore = () => {
            score++;
            document.getElementById("score-value").textContent = score;
        }

        const newFood = () => {
            let newX;
            let newY;
            do {
                newX = Math.floor(Math.random() * tileCount);
                newY = Math.floor(Math.random() * tileCount);
            } while (snake.some(part => part.x === newX && part.y === newY));
            food.x = newX;
            food.y = newY;
        }

        const checkBoundaries = (head) => {
            return (head.x >= tileCount || head.y >= tileCount || head.x < 0 || head.y <0) ? true : false;

        }

        const checkSelfCollision = (list, head) => {
              return list.some(part => {
                return part.x === head.x && part.y === head.y
              });
        }

        // Movement controls
        document.addEventListener("keydown", (e) => {
            e.preventDefault();
            switch (e.key) {          
                case "w":
                case "ArrowUp":
                    if (direction.y === 1 || direction.y === -1) break; // Prevent reversing direction
                        nextDirection = { x: 0, y: -1 };
                        break;
                case "s":
                case "ArrowDown":
                    if (direction.y === -1 || direction.y === 1) break; // Prevent reversing direction
                        nextDirection = { x: 0, y: 1 };
                        break;
                case "a":
                case "ArrowLeft":
                        if (direction.x === 1 || direction.x === -1) break; // Prevent reversing direction
                        nextDirection = { x: -1, y: 0 };
                        break;
                case "d":
                case "ArrowRight":
                    if (direction.x === -1 || direction.x === 1) break; // Prevent reversing direction
                        nextDirection = { x: 1, y: 0 };
                        break;
                case "p":
                    if(isPlaying)  {
                        togglePause();
                    }
                    break;
            }            
        })

        document.getElementById("restart").addEventListener("click", startGame);

    </script>

</body>
</html>
